<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>SCORPION</title>
<style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;padding:12px;font:14px "Malgun Gothic",Arial,sans-serif;color:#172b4d;min-height:100vh;background:transparent;isolation:isolate}main{max-width:1050px;margin:auto;padding:12px;background:transparent;border:0;border-radius:12px;box-shadow:none}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}h1{font-size:26px;margin:0}h1 small{font-size:12px;color:#64748b}p{font-size:12px;color:#475569;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.stat{background:rgba(241,245,251,.82);border:1px solid #d8e2ef;border-radius:7px;padding:6px 10px}.stat span{font-size:11px;display:block;color:#475569}.stat strong{font-size:22px;color:#1d4ed8}.toolbar,.controls{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}input,select,button,.btn{font:inherit;font-size:12px;border:1px solid #b8c6d7;border-radius:6px;background:white;padding:7px 9px;color:#172b4d}input{flex:1;min-width:120px}button,.btn{font-weight:bold;cursor:pointer;text-decoration:none}button.primary{color:white;background:#1d4ed8;border-color:#1d4ed8}a{color:#1d4ed8;text-decoration:none}a:hover{text-decoration:underline}.wrap{overflow:auto;border:1px solid #d6dfeb;border-radius:7px}table{width:100%;border-collapse:collapse;table-layout:fixed;background:transparent;font-size:13px}th{background:rgba(229,237,248,.94);font-size:12px;padding:7px 3px;color:#223b58}td{padding:4px 3px;text-align:center;white-space:nowrap;border-bottom:1px solid #e4eaf2;font-variant-numeric:tabular-nums;line-height:1.4}td:nth-child(2){text-align:left;overflow:hidden;text-overflow:ellipsis}tbody tr{background:rgba(255,255,255,.79)}tbody tr.stripe{background:rgba(244,247,251,.79)}tbody tr.player:hover{background:rgba(232,241,255,.95)}td:nth-child(5),td:nth-child(7){color:#1746a2;font-weight:bold}.nick{font-weight:bold}.up{color:#08783e;font-weight:bold}.down{color:#b42318;font-weight:bold}.muted{color:#64748b}.warn{color:#9a3412}.job{border:0;background:none;padding:0;font:inherit;cursor:pointer}.stale{font-size:10px;color:#9a3412}.chart{background:rgba(255,255,255,.83);border:1px solid #d6dfeb;border-radius:8px;margin-top:10px;padding:9px}h2{font-size:16px;margin:0}#plot{width:100%;max-height:230px;display:block}footer{font-size:11px;color:#475569;margin-top:8px}@media(max-width:600px){body{padding:4px}main{padding:6px}h1{font-size:21px}.stat{padding:5px}.stat strong{font-size:17px}table{font-size:11px}th{font-size:10px;padding:5px 1px}td{padding:4px 1px}.stale{display:block}input,select,button,.btn{padding:6px;font-size:11px}}

/* A single fixed image layer: no opaque main panel above it. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),url('./bg.jpg') center center/cover no-repeat #e8edf1}
header{background:rgba(255,255,255,.83);border-radius:8px;padding:8px 10px}
#status,.wrap+p,footer{background:rgba(255,255,255,.86);padding:4px 7px;border-radius:5px}

/* Character selection and separate official profile link. */
button.nick{background:none;border:0;padding:2px 3px;font:inherit;font-weight:bold;text-align:left;border-radius:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
button.nick:hover{text-decoration:underline;background:rgba(219,234,254,.8)}
button.nick[aria-expanded="true"]{background:#dbeafe;outline:1px solid #93c5fd}
button.nick:focus-visible,.official:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.official{display:inline-block;padding:3px 5px;border:1px solid #b8c6d7;background:rgba(255,255,255,.9);border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
@media(max-width:600px){table{min-width:560px}.official{font-size:10px;padding:2px 4px}}
/* Expand a single growth panel directly beneath its character. */
[hidden]{display:none!important}
tr.growth-row{background:rgba(255,255,255,.87)}
.growth-row>td{padding:5px 7px 8px;white-space:normal;text-align:left}
.growth-row .chart{margin:0;background:rgba(255,255,255,.94);padding:8px 10px}
.growth-row .controls{margin:5px 0}
.growth-row #plot{max-height:210px}
.growth-row h2{font-size:14px}
tr.player.selected{background:rgba(219,234,254,.95)}
</style></head><body><main>
<header><div><h1>SCORPION</h1><p>마족 · 루드라 · 스콜피온</p></div><a class="btn" href="https://github.com/55TrillionAlien/Scorpion/edit/main/members.json" target="_blank" rel="noopener">명단 관리 (관리자)</a></header>
<div class="stats"><div class="stat"><span>등록 캐릭터</span><strong id="count">—</strong></div><div class="stat"><span>평균 전투력(K)</span><strong id="avg">—</strong><p id="avgNote"></p></div><div class="stat"><span>최고 전투력(K)</span><strong id="best">—</strong></div></div>
<div class="toolbar"><input id="search" placeholder="닉네임 / 직업 검색" aria-label="검색"><select id="sort" aria-label="정렬"><option value="power">전투력 높은 순</option><option value="powerAsc">전투력 낮은 순</option><option value="itemLevel">아이템 레벨 높은 순</option><option value="itemLevelAsc">아이템 레벨 낮은 순</option><option value="name">닉네임 순</option></select><button class="primary" id="reload">새로고침</button><a class="btn" href="https://github.com/55TrillionAlien/Scorpion/actions/workflows/update.yml" target="_blank" rel="noopener">공식 갱신 (관리자)</a></div>
<p id="status" role="status">데이터 불러오는 중…</p><div class="wrap"><table><colgroup><col style="width:6%"><col style="width:24%"><col style="width:11%"><col style="width:12%"><col style="width:13%"><col style="width:10%"><col style="width:14%"><col style="width:10%"></colgroup><thead><tr><th>순위</th><th>닉네임</th><th>캐릭터</th><th>직업</th><th>전투력(K)</th><th>전일비</th><th>아이템 레벨</th><th>전일비</th></tr></thead><tbody id="rows"></tbody></table></div>
<p>전일비: 한국시간 어제 최종 정상 조회 대비. 기록 없으면 —. 닉네임 클릭 시 해당 행 바로 아래 성장 그래프 펼치기/접기. 상세보기는 NC 공식 캐릭터 정보실을 새 탭에서 엽니다.</p>
<div id="chartParking" hidden><section class="chart" id="growthPanel"><h2 id="chartTitle">전투력 성장 추이</h2><div class="controls"><select id="period" aria-label="기간"><option value="24">일별 · 최근 24시간</option><option value="7">주별 · 최근 7일</option></select></div><svg id="plot" viewBox="0 0 640 200" role="img" aria-label="전투력 성장 그래프"></svg><p id="note"></p></section></div><footer>매시간 30분에 갱신</footer>
</main><script>
'use strict';const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('ko-KR'),ok=n=>typeof n==='number'&&Number.isFinite(n),k=n=>Math.floor(n/1000);
const jobs={검성:['⚔','#a12d36'],수호성:['🛡','#2455a0'],살성:['🗡','#713c90'],궁성:['🏹','#166534'],마도성:['✦','#6d28a3'],정령성:['✧','#0f766e'],치유성:['✚','#9a5800'],호법성:['☀','#9a3412'],권성:['✊','#9d174d']};
let names=[],players=[],history={},busy=false,selectedName=null;
const panel=$('growthPanel'),parking=$('chartParking');
const time=v=>typeof v==='string'?Date.parse(v.replace(' KST','+09:00').replace(' ','T')):NaN;
const day=t=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(t);
const hour=t=>new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(t);
function points(n){return (Array.isArray(history[n])?history[n]:[]).filter(p=>Number.isFinite(time(p.at))&&ok(p.power)&&ok(p.itemLevel)).sort((a,b)=>time(a.at)-time(b.at));}
function prev(p){if(p.status!=='success'||!Number.isFinite(time(p.updatedAt))||day(time(p.updatedAt))!==day(Date.now()))return null;return points(p.name).filter(x=>day(time(x.at))===day(Date.now()-86400000)).at(-1)||null;}
function cell(tr,value,cls){const td=document.createElement('td');td.textContent=value;if(cls)td.className=cls;tr.append(td);return td;}
function delta(tr,n){cell(tr,n===null?'—':n>0?'▲ '+fmt(n):n<0?'▼ '+fmt(-n):'0',n>0?'up':n<0?'down':'muted');}
function render(){const good=players.filter(p=>p.status==='success'&&ok(p.power));$('count').textContent=names.length+'명';$('avg').textContent=good.length?fmt(k(good.reduce((a,p)=>a+p.power,0)/good.length)):'—';$('avgNote').textContent='정상 '+good.length+'/'+names.length+'명';$('best').textContent=good.length?fmt(k(Math.max(...good.map(p=>p.power)))):'—';
const rank=new Map([...players].filter(p=>ok(p.power)).sort((a,b)=>b.power-a.power).map((p,i)=>[p.name,i+1]));const q=$('search').value.trim().toLowerCase(),s=$('sort').value;const list=players.filter(p=>(p.name+' '+(p.job||'')).toLowerCase().includes(q));list.sort((a,b)=>{if(s==='name')return a.name.localeCompare(b.name,'ko');const f=s.replace('Asc','');if(!ok(a[f]))return ok(b[f])?1:0;if(!ok(b[f]))return -1;return s.endsWith('Asc')?a[f]-b[f]:b[f]-a[f]});parking.append(panel);$('rows').replaceChildren();
for(const [i,p] of list.entries()){const tr=document.createElement('tr');tr.className='player'+(i%2?' stripe':'')+(selectedName===p.name?' selected':'');cell(tr,rank.get(p.name)||'—');const td=cell(tr,'');const color=jobs[p.job]?.[1]||'#475569';const a=document.createElement('button');a.type='button';a.className='nick';a.textContent=p.name;a.style.color=color;a.dataset.name=p.name;a.title=p.name+' 성장 그래프 펼치기/접기';a.setAttribute('aria-expanded',String(selectedName===p.name));a.setAttribute('aria-controls','growthPanel');a.onclick=()=>{selectedName=selectedName===p.name?null:p.name;render();Array.from(document.querySelectorAll('button.nick')).find(b=>b.dataset.name===p.name)?.focus({preventScroll:true});};td.append(a);if(p.status!=='success'&&ok(p.power)){const flag=document.createElement('span');flag.className='stale';flag.textContent=' 이전값';td.append(flag)}const official=cell(tr,'');if(p.characterId){const link=document.createElement('a');link.className='official';link.textContent='상세보기';link.href='https://aion2.plaync.com/ko-kr/characters/2011/'+encodeURIComponent(p.characterId);link.target='_blank';link.rel='noopener noreferrer';link.setAttribute('aria-label',p.name+' NC 공식 캐릭터 정보실 (새 탭)');official.append(link)}else{official.textContent='—';official.className='muted'}const j=cell(tr,p.job||'—');j.style.color=color;const old=prev(p);const power=cell(tr,ok(p.power)?fmt(k(p.power)):'—');if(ok(p.power))power.title=fmt(p.power);delta(tr,old&&ok(p.power)?k(p.power)-k(old.power):null);cell(tr,ok(p.itemLevel)?fmt(p.itemLevel):'—');delta(tr,old&&ok(p.itemLevel)?p.itemLevel-old.itemLevel:null);$('rows').append(tr);
if(selectedName===p.name){const detail=document.createElement('tr');detail.className='growth-row';const content=document.createElement('td');content.colSpan=8;content.append(panel);detail.append(content);$('rows').append(detail);draw();}}
if(!names.includes(selectedName))selectedName=null;
}
function svg(tag,attrs,text){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;$('plot').append(e);return e}
function draw(){ $('plot').replaceChildren();const n=selectedName;if(!n)return;$('chartTitle').textContent='전투력 성장 추이 · '+n;const weekly=$('period').value==='7',now=Date.now(),all=points(n),map=new Map(),slots=[];
if(weekly){for(const p of all)map.set(day(time(p.at)),p);for(let i=6;i>=0;i--){const d=day(now-i*86400000);slots.push({label:d.slice(5),p:map.get(d)})}}else{const h=Math.floor(now/3600000)*3600000;for(const p of all)if(time(p.at)>=now-86400000&&time(p.at)<=now)map.set(Math.floor(time(p.at)/3600000)*3600000,p);for(let i=23;i>=0;i--){const t=h-i*3600000;slots.push({label:hour(t),p:map.get(t)})}}
const vals=slots.filter(s=>s.p).map(s=>s.p.power/1000);$('note').textContent=vals.length?n+' · 정상 기록 '+vals.length+'건 · 단위 K · 빈 구간은 조회 기록 없음':'정상 조회 기록이 아직 없습니다.';if(!vals.length){svg('text',{x:320,y:100,'text-anchor':'middle',fill:'#64748b','font-size':14},'성장 기록 누적 대기');return}
let lo=Math.floor(Math.min(...vals)),hi=Math.ceil(Math.max(...vals));if(hi===lo)hi=lo+1;const pad=Math.max(1,(hi-lo)*.12);lo=Math.max(0,lo-pad);hi+=pad;const x=i=>65+i*555/Math.max(1,slots.length-1),y=v=>165-(v-lo)*140/(hi-lo);for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3;svg('line',{x1:65,y1:y(v),x2:620,y2:y(v),stroke:'#dce5ef','stroke-dasharray':'4 4'});svg('text',{x:58,y:y(v)+4,'text-anchor':'end',fill:'#475569','font-size':10},fmt(Math.round(v)))}let previous=null;slots.forEach((s,i)=>{if(i===0||i===slots.length-1||weekly||i%4===0)svg('text',{x:x(i),y:187,'text-anchor':'middle',fill:'#475569','font-size':10},s.label);if(!s.p){previous=null;return}const yy=y(s.p.power/1000);if(previous)svg('line',{x1:previous.x,y1:previous.y,x2:x(i),y2:yy,stroke:'#2563eb','stroke-width':2});const dot=svg('circle',{cx:x(i),cy:yy,r:3.5,fill:'#1d4ed8'});const title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=s.p.at+' / '+fmt(s.p.power);dot.append(title);previous={x:x(i),y:yy}})}
async function get(file){const r=await fetch('./'+file+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(file+' HTTP '+r.status);return r.json()}
async function load(){if(busy)return;busy=true;$('reload').disabled=true;try{const [roster,data]=await Promise.all([get('members.json'),get('players.json')]);if(!Array.isArray(roster)||!Array.isArray(data.players))throw Error('데이터 형식 오류');names=roster;history=data.history||{};const map=new Map(data.players.map(p=>[p.name,p]));players=names.map(name=>({name,...map.get(name)}));const success=players.filter(p=>p.status==='success'&&ok(p.power)).length;const show=t=>Number.isFinite(time(t))?new Date(time(t)).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'기록 없음';$('status').textContent='최근 정상 데이터 갱신: '+show(data.updatedAt)+' · 최근 조회 '+success+'/'+names.length+'명'+(data.lastAttemptAt?' · 최근 시도 '+show(data.lastAttemptAt):'');$('status').className=success<names.length?'warn':'';render()}catch(e){$('status').textContent='데이터 불러오기 실패: '+e.message+' · 기존 표시 유지';$('status').className='warn'}finally{busy=false;$('reload').disabled=false}}
$('search').oninput=render;$('sort').onchange=render;$('period').onchange=draw;$('reload').onclick=load;load();setInterval(load,60000);
</script></body></html>
