name: SCORPION Auto Update
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - bg.jpg
      - members.json
      - update.py
      - update_v2.py
      - .github/workflows/update.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: scorpion-update
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update NC Character Data
        run: python -u update_v2.py
      - name: Save Player Data
        run: |
          git config user.name "SCORPION BOT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json
          if ! git diff --cached --quiet; then
            git commit -m "Update SCORPION ranking and history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  deploy:
    needs: collect
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare Website
        run: |
          mkdir -p public
          cp index.html members.json public/
          if [ -f bg.jpg ]; then cp bg.jpg public/; fi
          if [ -f players.json ]; then cp players.json public/; else printf '{"players":[],"history":{}}\n' > public/players.json; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
