name: SCORPION Auto Update

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - bg.jpg
      - members.json
      - update.py
      - update_v2.py
      - .github/workflows/update.yml

permissions:
  contents: read

concurrency:
  group: scorpion-update
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update NC Character Data
        run: python -u update_v2.py
      - name: Save Player Data
        run: |
          git config user.name "SCORPION BOT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json
          if ! git diff --cached --quiet; then
            git commit -m "Update SCORPION ranking and history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  build:
    needs: collect
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Prepare Website
        run: |
          mkdir -p public
          cp index.html members.json public/
          if [ -f bg.jpg ]; then cp bg.jpg public/; fi
          if [ -f players.json ]; then cp players.json public/; else printf '{"players":[],"history":{}}\n' > public/players.json; fi
          ls -lh public/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set Artifact Name
        id: artifact
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: public
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Uploaded Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          for attempt in $(seq 1 12); do
            echo "Checking artifact: $attempt/12"
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fx "$ARTIFACT_NAME"; then
              echo "Artifact found successfully."
              exit 0
            fi
            sleep 5
          done
          echo "Deployment artifact not found."
          exit 1
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
