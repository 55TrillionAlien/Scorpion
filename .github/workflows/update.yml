name: SCORPION Auto Update

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scorpion-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update NC Character Data
        run: python -u update.py

      - name: Save Player Data
        run: |
          git config user.name "SCORPION BOT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add players.json
          if ! git diff --cached --quiet; then
            git commit -m "Update SCORPION ranking"
            git push
          fi

      - name: Prepare Website
        run: |
          mkdir -p public
          cp index.html public/
          cp players.json public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Website
        uses: actions/deploy-pages@v4
